services:
  backend:
    build: ./backend
    environment:
      VQI_DATA_DIR: /data
      VQI_WORKER_COUNT: ${VQI_WORKER_COUNT:-1}
      VQI_DIRECT_DOWNLOAD_CONNECTIONS: ${VQI_DIRECT_DOWNLOAD_CONNECTIONS:-8}
      VQI_YOUTUBE_CONCURRENT_FRAGMENTS: ${VQI_YOUTUBE_CONCURRENT_FRAGMENTS:-8}
      VQI_API_KEY: ${VQI_API_KEY:-}
      VQI_CORS_ORIGINS: ${VQI_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://localhost}
    volumes:
      - media_forge_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ping', timeout=8).read()"]
      interval: 15s
      timeout: 12s
      retries: 8
      start_period: 25s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  media_forge_data:
